version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ehr_postgres
    environment:
      POSTGRES_USER: fde_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureEHR2026!}
      POSTGRES_DB: ehr_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde_admin -d ehr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ehr_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ehr_ui
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      API_CHAT_URL: http://api:8000/api/v1/chat
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
